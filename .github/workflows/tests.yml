name: Tests

# When the workflow runs: on every push to main, on pull requests,
# and manually from the Actions tab (workflow_dispatch)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow only needs to read the repository
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    # Safety net: a stuck run is cancelled instead of consuming minutes
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15.2"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Playwright downloads its own browser; --with-deps also installs the
      # Linux libraries that browser needs
      - name: Install Playwright browser
        run: playwright install --with-deps chromium

      - name: API tests
        run: pytest tests/api -v --html=reports/api_report.html --self-contained-html

      # DELICATE PART: !cancelled() makes these steps run even if the previous
      # one failed, so one run shows the result of all three groups
      - name: Playwright tests
        if: ${{ !cancelled() }}
        run: pytest tests/playwright_tests -v --html=reports/playwright_report.html --self-contained-html

      - name: Selenium tests
        if: ${{ !cancelled() }}
        env:
          HEADLESS: "1"
        run: pytest tests --ignore=tests/api --ignore=tests/playwright_tests -v --html=reports/selenium_report.html --self-contained-html

      # Keep the HTML reports and failure screenshots so they can be downloaded
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            reports/
            screenshots/
          if-no-files-found: ignore